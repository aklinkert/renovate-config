name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.200.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate requires node ^24.11
          node-version: 24
      - name: Validate the preset
        run: npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict default.json
